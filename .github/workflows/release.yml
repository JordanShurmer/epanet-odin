# release.yml — a v* tag becomes a GitHub release: the harness proves the
# engine on Linux, package.sh builds one tarball per platform, and the last
# job publishes them. See package.sh for what a tarball holds. Run by hand
# from the Actions tab (with the version to tag), it tags the commit it ran
# on as it publishes.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: the tag to make at this commit, vX.Y.Z
        required: true

env:
  ODIN_RELEASE: dev-2026-10   # the compiler, from github.com/odin-lang/Odin/releases
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-amd64 }
          - { os: macos-latest, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Odin
        run: |
          mkdir -p "$HOME/odin"
          curl -sSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_RELEASE/odin-${{ matrix.platform }}-$ODIN_RELEASE.tar.gz" \
            | tar xz -C "$HOME/odin" --strip-components=1
          echo "$HOME/odin" >> "$GITHUB_PATH"
          "$HOME/odin/odin" version
      - name: wasm-ld
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y lld; else brew install lld; fi
          wasm-ld --version
      - name: harness
        if: matrix.platform == 'linux-amd64'   # the plug-in build needs GNU objcopy
        run: harness/test.sh
      - name: package
        run: ./package.sh "$VERSION" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/epanet-odin-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$VERSION" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
